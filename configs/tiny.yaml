# Two layers, small enough to initialise and train on a laptop CPU. Same code
# path as base, so a shape error shows up here in seconds rather than on a
# rented card in an hour.
vocab_size: 8192
d_model: 128
num_heads: 4
num_kv_heads: 2
num_layers: 2
max_seq_len: 256

rope_theta: 1.0e5
dtype: float32

lanes: 2
sinkhorn_iters: 20

imprint_sites: [1]
imprint_orders: [2, 3]
imprint_slots: 256

dowser_dim: 64
dowser_probes: 2
gauge_probes: 4

kv_window: 128
kv_bits: 8
act_bits: 8
weight_bits: ""

remat: false
scan_unroll: 2
