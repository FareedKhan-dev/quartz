[project]
name = "quartz-lm"
version = "0.1.0"
description = "A 45M parameter foundation tool-calling model for phones, wearables, smart home and robots"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fareed Khan" }]
keywords = ["tool-calling", "on-device", "quantisation", "jax", "small-language-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Inference needs numpy and a tokenizer. Everything heavier is optional, so
# `import quartz` on a laptop does not drag in JAX.
dependencies = [
    "numpy>=1.24",
    "sentencepiece>=0.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["jax>=0.4.30", "jaxlib>=0.4.30", "flax>=0.10", "optax>=0.2"]
gpu = ["jax[cuda12]>=0.4.30", "flax>=0.10", "optax>=0.2"]
data = ["requests>=2.31", "datasets>=2.19"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pydantic>=2.0"]

[project.scripts]
quartz = "quartz.cli:main"

[project.urls]
Homepage = "https://github.com/FareedKhan-dev/quartz"
Issues = "https://github.com/FareedKhan-dev/quartz/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quartz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end tests that build or train a tiny model",
    "needs_jax: requires the train extra",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E741"]

[tool.coverage.run]
source = ["quartz"]
omit = ["*/cli.py"]
